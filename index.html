<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>房源搜尋系統</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { margin: 5px; padding: 6px; }
    .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>房源篩選器</h2>
  <input type="text" id="kw" placeholder="關鍵字（地址）">
  <input type="number" id="minRent" placeholder="最低租金">
  <input type="number" id="maxRent" placeholder="最高租金">
  <select id="nearStation">
    <option value="">火車站距離（不限）</option>
    <option value="是">靠近火車站</option>
    <option value="否">非火車站附近</option>
  </select>
  <button onclick="filter()">搜尋</button>

  <div id="results"></div>

  <script>
    const API_URL = "<<<請貼上你的 Apps Script 網址>>>";
    let listings = [];

    fetch(API_URL)
      .then(res => res.json())
      .then(json => {
        listings = json;
        render(listings);
      });

    function render(data) {
      const div = document.getElementById('results');
      div.innerHTML = '';
      data.forEach(item => {
        div.innerHTML += `
          <div class="card">
            <strong>${item.地址}</strong><br>
            租金：${item.租金} 元<br>
            電費：${item.電費標準}｜水費：${item.水費標準}<br>
            獨立洗曬：${item.獨洗曬}｜靠近火車站：${item.靠近火車站}
          </div>
        `;
      });
    }

    function filter() {
      const kw = document.getElementById('kw').value;
      const min = parseInt(document.getElementById('minRent').value) || 0;
      const max = parseInt(document.getElementById('maxRent').value) || Infinity;
      const station = document.getElementById('nearStation').value;

      const result = listings.filter(item => {
        return item.地址.includes(kw) &&
               item.租金 >= min &&
               item.租金 <= max &&
               (station === "" || item.靠近火車站 === station);
      });

      render(result);
    }
  </script>
</body>
</html>
